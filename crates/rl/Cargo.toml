[package]
name = "rust-rl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Reinforcement learning and planning with tabular, statistical, and neural methods"

[lib]
name = "rl"

[dependencies]
burn = { workspace = true, optional = true }
burn-pack = { version = "=0.22.1", optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rand_distr.workspace = true
nalgebra.workspace = true
libm.workspace = true
crc32fast = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3"
criterion = "0.7"
libm.workspace = true
sha2 = "0.10.9"

[[bench]]
name = "components"
harness = false
required-features = ["neural"]

[[bench]]
name = "allocation_probe"
harness = false
required-features = ["neural"]

[[bench]]
name = "recurrent_mpo_allocations"
harness = false
required-features = ["probes"]

[[bench]]
name = "quantile_update"
harness = false
required-features = ["neural"]

[[bench]]
name = "collector_update"
harness = false
required-features = ["neural"]


[[bench]]
name = 'lqg_batch'
harness = false

[[bench]]
name = "diagnostic_overhead"
harness = false
required-features = ["diagnostics", "neural"]

[[bench]]
name = "structured_graph"
harness = false
required-features = ["neural"]

[features]
default = ["neural"]
neural = ["dep:burn", "dep:burn-pack"]
experimental-acer = ["neural"]
probes = ["neural"]
diagnostics = ["dep:crc32fast", "dep:flate2"]

[[test]]
name = "categorical_replay"
required-features = ["experimental-acer"]

[[test]]
name = "recurrent_acer"
required-features = ["experimental-acer"]

[[bin]]
name = "rl-precompute"
path = "src/bin/rl-precompute.rs"
required-features = ["diagnostics", "neural"]

[[example]]
name = "custom_env"
required-features = ["neural"]

[[example]]
name = "diagnostic_generic"
required-features = ["diagnostics", "neural"]

[[example]]
name = "ppo_lqg"
required-features = ["neural"]

[[bench]]
name = "statistical_factorization"
harness = false

[[example]]
name = "diagnostic_session"
required-features = ["diagnostics", "neural"]

[[example]]
name = "diagnostic_gridworld"
required-features = ["diagnostics"]

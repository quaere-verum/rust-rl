[package]
name = "rl-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Native interactive RL diagnostics laboratory"

[dependencies]
rl = { package = "rust-rl", path = "../rl", default-features = false, features = ["diagnostics", "neural"] }
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_plot = { version = "=0.38.0", default-features = false }
serde.workspace = true
nalgebra.workspace = true
serde_json.workspace = true
png = { version = "0.18", optional = true }

[dev-dependencies]
tempfile = "3"
rand.workspace = true
rand_chacha.workspace = true

[features]
default = ["wgpu"]
screenshots = ["dep:png"]
wgpu = ["eframe/wgpu"]

[[bench]]
name = "recordings"
harness = false

[[bench]]
name = "hot_paths"
harness = false

[[example]]
name = "workspace_navigation"
required-features = ["screenshots"]

[[example]]
name = "policy_training_navigation"
required-features = ["screenshots"]

[[example]]
name = "policy_value_navigation"
required-features = ["screenshots"]

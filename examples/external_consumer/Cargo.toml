[package]
name = "rust-rl-external-consumer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace]
resolver = "3"

[features]
neural = ["rl/neural"]

[dependencies]
rl = { package = "rust-rl", path = "../../crates/rl", default-features = false }
rand = "0.9"
rand_chacha = "0.9"

[profile.dev]
debug = 0

[profile.test]
debug = 0
